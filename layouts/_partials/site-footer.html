{{- $authorURL := site.Params.authorURL | default "https://github.com/bep" -}}
<footer class="site-footer">
	{{- with site.Params.photoCaption }}
		<span>{{ T "photo" }}: {{ . }}</span>
		<span class="footer-dot" aria-hidden="true"></span>
	{{- end }}
	<span>{{ T "last-updated" }} <time datetime="{{ .Lastmod.Format `2006-01-02` }}">{{ .Lastmod | time.Format ":date_medium" }}</time></span>
	<span class="footer-dot" aria-hidden="true"></span>
	<span>powered by <a href="https://gohugo.io/">Hugo</a></span>
</footer>
