baseURL                = "https://bep.is/"
title                  = "bep.is"
defaultContentLanguage = "en"
timeZone               = "Europe/Oslo"
enableRobotsTXT        = true

defaultContentLanguageInSubdir = true

_merge = "deep"

disableKinds = ["taxonomy", "term", "section", "rss"]

[caches]
	[caches.images]
		dir    = ':cacheDir'
		maxAge = -1

[imaging]
	resampleFilter = "CatmullRom"
	anchor         = "smart"
	[imaging.jpeg]
		quality = 75
	[imaging.webp]
		quality = 75

[params]
	name         = "bep.is"
	description  = "bep.is Bjørn Erik Pedersen — software developer and saxophone player from Norway."
	author       = "Bjørn Erik Pedersen"
	authorURL    = "https://github.com/bep"
	authorHandle = "bep"
	email        = "bjorn.erik.pedersen@gmail.com"
	themeColor   = "#00212f"
	fontsHref    = "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap"

	# Where the hero photo was taken; shown as a caption in the footer.
	photoCaption = "Fjærland, Sogn"

	# Rendered as the "elsewhere" list on the home page and as schema.org sameAs.
	# The desc values are i18n keys.
	[[params.elsewhere]]
		name = "GitHub"
		url  = "https://github.com/bep"
		desc = "code"
	[[params.elsewhere]]
		name = "LinkedIn"
		url  = "https://no.linkedin.com/in/bjørn-erik-pedersen-b0024415"
		desc = "work"
	[[params.elsewhere]]
		name = "Wikipedia"
		url  = "https://nn.wikipedia.org/wiki/Brukar:Bep"
		desc = "wiki"
	[[params.elsewhere]]
		name = "Twitter"
		url  = "https://twitter.com/bepsays"
		desc = "posts"
	[[params.elsewhere]]
		name = "staticbattery.com"
		url  = "https://staticbattery.com/"
		desc = "photos"
	[[params.elsewhere]]
		name = "bepsays.com"
		url  = "https://bepsays.com/"
		desc = "writing"

	# Design tokens consumed via @import "hugo:vars" in main.css.
	# The palette is sampled from the fjord in the hero photo: bg is the
	# water at the bottom edge so the photo dissolves into the page.
	# bep.is is dark only; no [params.vars.dark] override block needed.
	# bg is restated as hex in themeColor above.
	[params.vars]
		bg        = "oklch(23.2% 0.046 230)"
		surface   = "oklch(27% 0.050 234)"
		rule      = "oklch(42% 0.045 232)"
		rule-soft = "oklch(32% 0.045 232)"
		fg        = "oklch(96% 0.008 230)"
		fg-mute   = "oklch(80% 0.025 230)"
		fg-dim    = "oklch(66% 0.032 230)"
		accent    = "oklch(84% 0.110 78)"
		match-bg  = "oklch(40% 0.070 236)"
		match-fg  = "oklch(97% 0.010 230)"
		# font-sans is the shared token name for the body face; here it's a serif.
		font-sans = '"Newsreader", ui-serif, Georgia, serif'
		font-mono = '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace'

[languages]
	[languages.en]
		weight       = 1
		label        = "English"
		locale       = "en-us"
		[languages.en.params]
			# Link text on the other translations, in this language.
			readIn   = "Read in English"
			notFound = "Sorry, this page doesn’t exist."
			backHome = "Go to the front page"
	[languages.nn]
		weight       = 2
		label        = "Nynorsk"
		locale       = "nn-no"
		[languages.nn.params]
			readIn   = "Les på nynorsk"
			notFound = "Beklagar, denne sida finst ikkje."
			backHome = "Gå til framsida"

# The root /404.html (for CloudFront's error page and hugo server),
# rendered from the English home page with all languages in it.
# The per-language 404 pages end up in /en/ and /nn/.
[outputFormats]
	[outputFormats.notfound]
		mediaType      = "text/html"
		baseName       = "404"
		isHTML         = true
		root           = true
		permalinkable  = false
		notAlternative = true

[sitemap]
	changefreq = "monthly"
	priority   = 1.0
	filename   = "sitemap.xml"

[module]
	[[module.imports]]
		path = "github.com/bep/gitjoin.com"
		# Only the shared theme; keep gitjoin.com's own content out.
		[[module.imports.mounts]]
			source = "layouts"
			target = "layouts"
		[[module.imports.mounts]]
			source = "assets"
			target = "assets"

# Legacy S3/CloudFront hosting. Remove once bep.is is served by the
# Cloudflare Worker (see wrangler.toml / build.sh).
[deployment]
	[[deployment.targets]]
		name                     = "s3"
		url                      = "s3://bep.is?region=eu-west-1&prefix=root/"
		cloudFrontDistributionID = "E1TX7TXFKWFR6S"
		stripIndexHtml           = true
	[[deployment.matchers]]
		pattern      = "^.+\\.(js|css|svg|ttf|woff2|webp|avif)$"
		cacheControl = "max-age=31536000, no-transform, public"
		gzip         = true
	[[deployment.matchers]]
		pattern      = "^.+\\.(png|jpg)$"
		cacheControl = "max-age=31536000, no-transform, public"
		gzip         = false
	[[deployment.matchers]]
		pattern     = "^sitemap\\.xml$"
		contentType = "application/xml"
		gzip        = true
	[[deployment.matchers]]
		pattern = "^.+\\.(html|xml|json|txt)$"
		gzip    = true
